<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Intelligence</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <div class="login-container" id="loginPage">
    <div class="login-card">
      <div class="login-header">
        <i class="fas fa-shield-alt"></i>
        <h1>Fraud Intelligence</h1>
      </div>
      <form class="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user"></i>
            Username
          </label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn-primary">
          <i class="fas fa-sign-in-alt"></i>
          Login
        </button>
      </form>
    </div>
  </div>

  <div class="container" id="mainContent" style="display: none;">
    <main class="main-content">
      <header>
        <div class="logo">
          <i class="fas fa-shield-alt"></i>
          <h1>FRAUD INTELLIGENCE</h1>
        </div>
        <div class="user-info">
          <span id="userDisplay"></span>
          <button class="btn-secondary" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </header>

      <div class="content-wrapper">
        <section class="card" id="upload">
          <div class="card-header">
            <h2><i class="fas fa-upload"></i> Upload CSV File</h2>
          </div>
          <div class="card-body">
            <div class="upload-area" id="dropZone">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Drag and drop your CSV file here or</p>
              <input type="file" id="fileInput" accept=".csv" />
              <button class="btn-primary" onclick="uploadFile()">
                <i class="fas fa-upload"></i> Upload File
              </button>
            </div>
          </div>
        </section>
        
        <section class="card" id="files">
          <div class="card-header">
            <h2><i class="fas fa-file-alt"></i> Uploaded Files</h2>
          </div>
          <div class="card-body">
            <div class="file-list" id="fileList"></div>
          </div>
        </section>

        <section class="card" id="viewData" style="display:none;">
          <div class="card-header">
            <h2><i class="fas fa-table"></i> Data Preview</h2>
          </div>
          <div class="card-body">
            <div class="action-buttons">
              <button class="btn-primary" onclick="analyzeFile()">
                <i class="fas fa-chart-line"></i> Analyze Data
              </button>
              <button class="btn-primary" onclick="predictFraud()">
                <i class="fas fa-search"></i> Run Prediction
              </button>
            </div>
            <div id="analysisResult" class="analysis-results"></div>
            <div id="predictionResults" class="prediction-results"></div>
            
            <div class="statistics-section">
              <div class="chart-container">
                <canvas id="fraudChart"></canvas>
              </div>
              <div class="chart-container">
                <canvas id="amountDistribution"></canvas>
              </div>
              <div class="chart-container">
                <canvas id="timePattern"></canvas>
              </div>
            </div>

            <div class="table-container">
              <table id="dataTable">
                <thead>
                  <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div class="pagination">
              <button class="btn-secondary" id="prevPage" onclick="prevPage()">
                <i class="fas fa-chevron-left"></i>
              </button>
              <span id="currentPage" class="page-info"></span>
              <button class="btn-secondary" id="nextPage" onclick="nextPage()">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
